# CommuteIQ Official Knowledge Base Sources
# Strict two-tier corpus for context engineering:
# - VERIFIED: Official government regulations, statutory transit authority rules, and gazette notifications
# - UNVERIFIED: Reputable news coverage, investigative reports, and transit blog analyses

