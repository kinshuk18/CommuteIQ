    doc_type: "pdf"
    description: "Statutory aggregator regulatory framework (July 2025) issued under Section 93 of Motor Vehicles Act, covering licensing validity (5 years), surge pricing caps, driver working hours limit, induction training (40 hours), passenger insurance, and EV fleet transition."

