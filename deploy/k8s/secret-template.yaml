# Secret template — replace all <FILL_ME> values before applying.
# Store real values in AWS Secrets Manager / GCP Secret Manager / Azure Key Vault
# and inject via External Secrets Operator or sealed-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: commuteiq-secrets
type: Opaque
stringData:
  LLM_API_KEY: "<FILL_ME>"
  GROQ_API_KEY: "<FILL_ME>"
  AI_SHARED_SECRET: "<FILL_ME>"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/commuteiq"
  SPRING_DATASOURCE_USERNAME: "<FILL_ME>"
  SPRING_DATASOURCE_PASSWORD: "<FILL_ME>"
  DB_URL: "host=postgres-service port=5432 dbname=commuteiq user=<FILL_ME> password=<FILL_ME>"
