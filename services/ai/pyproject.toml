[project]
name = "commuteiq-ai"
version = "0.1.0"
description = "CommuteIQ AI service: GTFS router, ML runtime predictor, RAG agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.1.0",
    "redis[hiredis]>=5.0.0",
    "prometheus-client>=0.20.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "mlflow>=2.15.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiokafka>=0.11.0",
    # Phase 4 additions (declared now, used later)
    "llama-index>=0.11.0",
    "llama-index-vector-stores-faiss>=0.2.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "faiss-cpu>=1.8.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
pinecone = ["pinecone-client>=3.0.0", "llama-index-vector-stores-pinecone>=0.2.0"]
weaviate = ["weaviate-client>=4.0.0", "llama-index-vector-stores-weaviate>=0.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
