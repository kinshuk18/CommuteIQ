spring:
  application:
    name: commuteiq-gateway

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/commuteiq}
    username: ${SPRING_DATASOURCE_USERNAME:commuteiq}
    password: ${SPRING_DATASOURCE_PASSWORD:commuteiq}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns DDL; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

  graphql:
    graphiql:
      enabled: true
    path: /graphql

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3

server:
  port: 8080
  error:
    include-message: never   # hide stack traces in error responses

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# ai-service integration
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8001}
  shared-secret: ${AI_SHARED_SECRET:changeme-dev-secret}
  timeout-ms: 30000

# feature flags
kafka:
  enabled: ${KAFKA_ENABLED:true}

# springdoc
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# rate limiter (hand-written Lua; window and capacity defined here for injection)
rate-limit:
  window-seconds: 60
  capacity: 120

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      ai-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      ai-service:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    instances:
      ai-service:
        timeout-duration: 30s
